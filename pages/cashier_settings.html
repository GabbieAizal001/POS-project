<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POSify - Cashier Preferences</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../styles/cashier_dashboard.css"/>
  <link rel="stylesheet" href="../styles/settings.css"/>
  <script src="settings.js" defer></script>
</head>
<body>

<div class="container settings-container">

  <!-- SIDEBAR - Cashier style -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">POS</div>
      <div class="sidebar-brand">POSify</div>
    </div>
    <div class="sidebar-nav">
      <a href="cashier_dashboard.html" class="sidebar-link">Dashboard</a>
      <a href="product_management.html" class="sidebar-link" data-role-cashier>Products</a>
      <a href="cashier_checkout.html" class="sidebar-link">New Sale</a>
      <a href="cashier_history.html" class="sidebar-link">History</a>
    </div>
    <div class="sidebar-footer">
      <a href="login.html" class="sidebar-link">Logout</a>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <span class="welcome-text">My Preferences</span>
      </div>
      <div class="topbar-right">
        <div class="profile-circle">
          <i class="fa-solid fa-user"></i>
        </div>
        <div class="profile-info">
          <div class="profile-name">Cashier Name</div>
          <div class="profile-role">Cashier</div>
        </div>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content">

      <!-- Theme Toggle -->
      <div class="settings-section">
        <h3><i class="fa-solid fa-moon-stars"></i> Appearance</h3>
        <div class="theme-toggle">
          <span>Dark Mode</span>
          <div id="themeToggle" class="theme-switch">
            <span></span>
          </div>
        </div>
      </div>

      <!-- Receipt Preferences -->
      <div class="settings-section">
        <h3><i class="fa-solid fa-receipt"></i> Receipt Preferences</h3>
        <form id="cashierSettingsForm" class="settings-form-grid">
          <div class="form-group">
            <label>Show Thank You Message</label>
            <input type="text" name="thankYouMsg" value="Thank you for shopping with us!">
          </div>
          <div class="form-group">
            <label>Print Loyalty Points</label>
            <input type="checkbox" name="printLoyalty" checked>
          </div>
          <div class="form-group">
            <label>Auto Print Receipt</label>
            <input type="checkbox" name="autoPrint" checked>
          </div>
          <button type="submit" class="save-btn">Save Receipt Preferences</button>
        </form>
      </div>

      <!-- Personal Preferences -->
      <div class="settings-section">
        <h3><i class="fa-solid fa-user-gear"></i> Personal Preferences</h3>
        <form class="settings-form-grid">
          <div class="form-group">
            <label>Sound Notifications</label>
            <select name="soundNotifications">
              <option>Enabled</option>
              <option>Disabled</option>
            </select>
          </div>
          <div class="form-group">
            <label>Quick Keys Layout</label>
            <select name="quickKeys">
              <option>Standard</option>
              <option>Large Buttons</option>
            </select>
          </div>
          <div class="form-group">
            <label>Daily Sales Target</label>
            <input type="number" name="personalTarget" value="2500">
          </div>
          <button type="submit" class="save-btn">Save Personal Preferences</button>
        </form>
      </div>

    </div>
  </div>
</div>

</body>
</html>
