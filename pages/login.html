<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <div class="sidebar-logo">POS</div>
    
    
    <div id="border">
        
        <form id="loginForm">
            <h1>Welcome</h1>
            <input type="text" id="employee_id" name="employee_id" placeholder="Employee id" required><br><br>
            <input type="password" id="password" name="password" placeholder="Password" required><br><br>
            <button type="submit" id="login_btn">Login</button>
            <a id="forgot_password" href="">Forgot password?</a>
        </form>
    </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../scripts/supabase.js"></script>
<script src="../scripts/login.js"></script>
<script>
    // Check if they already chose dark mode in the past
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
</script>

</body>
</html>
