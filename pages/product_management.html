<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POSify - Products (In Stock)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../styles/cashier_dashboard.css"/> <!-- Cashier style -->
<link rel="stylesheet" href="../styles/a_Dashboard.css"/>

  <script src="../scripts/productData.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../scripts/supabase.js"></script>
  <script src="../scripts/auth-guard.js"></script>
  <script src="../scripts/user-profile.js"></script>
  <script src="../scripts/sidebar-highlight.js"></script>

</head>
<body>

<div class="container">
  <!-- SIDEBAR - Cashier style -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">POS</div>
      <div class="sidebar-brand">POSify</div>
    </div>
    <div class="sidebar-nav">
      <!-- Cashier only access -->
      <a href="cashier_dashboard.html" class="sidebar-link" data-role-cashier>Dashboard</a>
      <a href="product_management.html" class="sidebar-link" data-role-cashier>Products</a>
      <a href="cashier_checkout.html" class="sidebar-link" data-role-cashier">New Sale</a>
      <a href="cashier_history.html" class="sidebar-link" data-role-cashier>History</a>
    </div>
    <div class="sidebar-footer">
      <a href="login.html" class="sidebar-link">Logout</a>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <span class="welcome-text">Products (In Stock)</span>
      </div>
      <div class="topbar-right">
        <div class="profile-circle"><i class="fa-solid fa-user"></i></div>
        <div class="profile-info">
          <div class="profile-name">Cashier Name</div>
          <div class="profile-role">Cashier</div>
        </div>
      </div>
    </div>

    <div class="content content-cashier">
      <!-- Search -->
      <div class="card full-width">
        <div class="card-header">
          <span class="card-title">Available Products (<span id="stockCount">0</span>)</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search name or barcode...">
        </div>
        <div class="card-body">
          <div class="products-grid" id="productsList">
            <!-- Dynamic list -->
            <div class="empty-state">
              <i class="fa-solid fa-box-open"></i>
              <p>No products in stock</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.full-width { width: 100%; margin-bottom: 24px; }
.card-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.search-input { padding: 10px 16px; border: 2px solid rgba(139,156,228,0.3); border-radius: 12px; max-width: 300px; }
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
.product-card { 
  background: rgba(255,255,255,0.7); padding: 24px; border-radius: 16px; 
  display: flex; gap: 16px; align-items: center; cursor: pointer; transition: all 0.2s; 
  border: 2px solid transparent;
}
.product-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
.product-name { font-size: 18px; font-weight: 600; margin: 0 0 4px 0; }
.product-barcode { 
  background: var(--primary-light); color: var(--primary); padding: 8px 12px; 
  border-radius: 8px; font-family: monospace; font-size: 14px; font-weight: 500;
}
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
@media (max-width: 768px) { .products-grid { grid-template-columns: 1fr; } .product-card { flex-direction: column; text-align: center; gap: 12px; } }
</style>

<script>
// Role protection - Cashier only
const urlParams = new URLSearchParams(window.location.search);
const role = urlParams.get('role') || localStorage.getItem('userRole') || 'cashier';
if (role !== 'cashier') {
  document.body.innerHTML = `
    <div style="display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; text-align:center; padding:40px; color:#dc2626;">
      <i class="fa-solid fa-lock" style="font-size:64px; margin-bottom:20px;"></i>
      <h2>Access Denied</h2>
      <p>Products page is for Cashiers only.</p>
      <a href="${role === 'admin' ? 'admin_dashboard.html' : 'manager_dashboard.html'}" style="margin-top:20px; color:var(--primary); text-decoration:none;">← Go to Dashboard</a>
    </div>
  `;
  document.head.innerHTML = '<title>Access Denied - Products</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">';
  throw new Error('Access denied');
}

// Load and display products
function renderProducts(products) {
  const list = document.getElementById('productsList');
  const countEl = document.getElementById('stockCount');
  
  if (products.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-box-open"></i>
        <p>No products in stock. Ask manager to restock.</p>
      </div>
    `;
  } else {
    list.innerHTML = products.map(p => `
      <div class="product-card" onclick="copyBarcode('${p.barcode}')" title="Click to copy barcode">
        <div class="product-icon">
          <i class="fa-solid fa-box"></i>
        </div>
        <div class="product-info-main">
          <div class="product-name">${p.name}</div>
          <div class="product-barcode-unit">
            <span class="product-barcode">#${p.barcode}</span>
            ${p.unit ? `<span class="product-unit">${p.unit}</span>` : ''}
          </div>
        </div>
        <div class="product-pricing-details">
          <div class="product-price-row">
            <span class="product-detail-label">Price:</span>
            <span class="product-price">GHC ${p.price.toFixed(2)}</span>
          </div>
          <div class="product-tax-row">
            <span class="product-detail-label">Tax:</span>
            <span class="product-tax">${p.tax_rate !== undefined ? p.tax_rate + '%' : 'N/A'}</span>
          </div>
          <div class="product-discount-row">
            <span class="product-detail-label">Discount:</span>
            <span class="product-discount">${
              p.discount_eligibility ? p.discount_eligibility.charAt(0).toUpperCase() + p.discount_eligibility.slice(1) : 'N/A'
            }</span>
          </div>
        </div>

      </div>
    `).join('');
  }
  countEl.textContent = products.length;
}

let allProducts = [];

async function fetchProductsFromDB() {
  try {
    // Fetch real inventory from Supabase
    const { data, error } = await window.supabase
      .from('inventory')
      .select('*')
      .order('item_name');
      
    if (error) throw error;
    
    // Map DB fields to UI template fields and filter out-of-stock items
    allProducts = (data || [])
      .filter(item => item.quantity > 0)
      .map(item => ({
        id: item.id,
        name: item.item_name, // Map 'item_name' from DB to 'name' used in UI
        barcode: item.barcode,
        price: parseFloat(item.price),
        tax_rate: item.tax_rate,
        unit: item.unit,
        discount_eligibility: item.discount_eligibility
      }));
      
    renderProducts(allProducts);
  } catch (err) {
    console.error("DB Fetch Error:", err);
    document.getElementById('productsList').innerHTML = `<div class="empty-state"><p style="color:red">Failed to load products: ${err.message}</p></div>`;
  }
}

// Search
document.getElementById('searchInput').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  const filtered = allProducts.filter(p => 
    p.name.toLowerCase().includes(query) || 
    (p.barcode && p.barcode.toLowerCase().includes(query))
  );
  renderProducts(filtered);
});

// Copy barcode to clipboard
function copyBarcode(barcode) {
  navigator.clipboard.writeText(barcode).then(() => {
    const oldText = document.querySelector('.welcome-text').textContent;
    document.querySelector('.welcome-text').textContent = `Copied: ${barcode}`;
    setTimeout(() => { // Removed semi-colon
        document.querySelector('.welcome-text').textContent = oldText;
      }, 1500); // Removed semi-colon
  });
}

// Initialize
fetchProductsFromDB();
</script>

</body>
</html>
