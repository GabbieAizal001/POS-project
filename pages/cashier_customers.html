<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POSify - Customers</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../styles/cashier_dashboard.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">

  <!-- SIDEBAR - Cashier Style -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">POS</div>
      <div class="sidebar-brand">POSify</div>
    </div>
    <div class="sidebar-nav">
      <a href="cashier_dashboard.html" class="sidebar-link">Dashboard</a>
      <a href="product_management.html" class="sidebar-link" data-role-cashier>Products</a>
      <a href="cashier_checkout.html" class="sidebar-link">New Sale</a>
      <a href="cashier_history.html" class="sidebar-link">History</a>
      <a href="cashier_customers.html" class="sidebar-link active">Customers</a>
    </div>
    <div class="sidebar-footer">
      <a href="#" onclick="logout()" class="sidebar-link">Logout</a>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <span class="welcome-text">Customer Lookup</span>
        <span class="page-subtitle">Select a customer for this sale</span>
      </div>
      <div class="topbar-right">
        <div class="profile-circle">
          <i class="fa-solid fa-user"></i>
        </div>
        <div class="profile-info">
          <div class="profile-name">Cashier Name</div>
          <div class="profile-role">Cashier</div>
        </div>
      </div>
    </div>

    <div class="content content-cashier">
      
      <!-- Search Header -->
      <div class="search-header">
        <div class="search-group">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="customerSearch" class="search-input" placeholder="Search by name or phone number...">
        </div>
        <div class="search-stats">
          <span id="customerCount">0 customers</span>
        </div>
      </div>

      <!-- Customers Grid -->
      <div class="customers-grid" id="customersGrid">
        <div class="empty-state">
          <i class="fa-solid fa-users" style="font-size: 48px; color: #cbd5e1; margin-bottom: 16px;"></i>
          <h3>No customers found</h3>
          <p>Start typing to search or ask manager to add customers</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="customers-actions">
        <button class="btn-secondary" onclick="closeCustomerLookup()">
          <i class="fa-solid fa-times"></i> Cancel
        </button>
        <button class="btn-primary" id="continueBtn" disabled onclick="continueSale()">
          <i class="fa-solid fa-shopping-cart"></i> Continue Sale
        </button>
      </div>

    </div>
  </div>
</div>

<script src="../scripts/supabase.js"></script>
<script src="../scripts/auth-guard.js"></script>
<script src="../scripts/user-profile.js"></script>
<script src="../scripts/sidebar-highlight.js"></script>
<script>
// Customer Lookup - Cashier Version
let customers = [];
let selectedCustomer = null;

async function loadCustomers() {
  try {
    const { data, error } = await window.supabase
      .from('customers')
      .select('*')
      .order('full_name');
    
    if (error) throw error;
    
    customers = data || [];
    renderCustomers();
    updateCount();
  } catch (err) {
    console.error('Load customers error:', err);
    showError('Failed to load customers');
  }
}

function renderCustomers() {
  const searchTerm = document.getElementById('customerSearch').value.toLowerCase();
  const filtered = customers.filter(c => 
    c.full_name.toLowerCase().includes(searchTerm) ||
    c.phone.includes(searchTerm)
  );

  const grid = document.getElementById('customersGrid');
  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-users" style="font-size: 48px; color: #cbd5e1; margin-bottom: 16px;"></i>
        <h3>No customers found</h3>
        <p>Start typing to search or ask manager to add customers</p>
      </div>
    `;
    return;
  }

  grid.innerHTML = filtered.map(customer => {
    const initials = customer.full_name.split(' ').map(n => n[0]).join('').toUpperCase();
    return `
      <div class="customer-card" id="customer-card-${customer.id}" onclick="selectCustomer('${customer.id}')">
        <div class="customer-avatar">${initials}</div>
        <div class="customer-info">
          <div class="customer-name">${customer.full_name}</div>
          <div class="customer-phone">${customer.phone}</div>
          ${customer.email ? `<div class="customer-email">${customer.email}</div>` : ''}
        </div>
        <div class="customer-select">
          <i class="fa-solid fa-check-circle"></i>
        </div>
      </div>
    `;
  }).join('');
}

function selectCustomer(id) {
  selectedCustomer = customers.find(c => String(c.id) === String(id));
  
  // Visual feedback
  document.querySelectorAll('.customer-card').forEach(card => card.classList.remove('selected'));
  const selectedCard = document.getElementById(`customer-card-${id}`);
  if (selectedCard) {
    selectedCard.classList.add('selected');
  }
  
  const continueBtn = document.getElementById('continueBtn');
  continueBtn.disabled = false;
  continueBtn.innerHTML = `<i class="fa-solid fa-shopping-cart"></i> Use ${selectedCustomer.full_name}`;
}

function closeCustomerLookup() {
  window.history.back();
}

function continueSale() {
  if (!selectedCustomer) {
    alert('Please select a customer first');
    return;
  }
  
  // Store selected customer in sessionStorage for checkout
  sessionStorage.setItem('selectedCustomer', JSON.stringify(selectedCustomer));
  
  // Return to checkout
  window.location.href = 'cashier_checkout.html';
}

function updateCount() {
  const countEl = document.getElementById('customerCount');
  if (countEl) {
    countEl.textContent = `${customers.length} customers`;
  }
}

function showError(message) {
  const grid = document.getElementById('customersGrid');
  grid.innerHTML = `
    <div class="error-state">
      <i class="fa-solid fa-exclamation-triangle" style="font-size: 48px; color: #ef4444;"></i>
      <h3>Error</h3>
      <p>${message}</p>
    </div>
  `;
}

// Event listeners
document.getElementById('customerSearch').addEventListener('input', renderCustomers);
document.getElementById('continueBtn').addEventListener('click', continueSale);

// Init
document.addEventListener('DOMContentLoaded', () => {
  loadCustomers();
});
</script>

<style>
/* Cashier Customer Lookup Styles */
.content-cashier {
  padding: 24px;
}

.search-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
  background: rgba(255,255,255,0.7);
  padding: 20px 24px;
  border-radius: 20px;
  border: 1px solid rgba(0,0,0,0.08);
  backdrop-filter: blur(10px);
}

.search-group {
  position: relative;
  flex: 1;
  max-width: 500px;
}

.search-icon {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  color: #94a3b8;
  font-size: 18px;
  z-index: 2;
}

.search-input {
  width: 100%;
  padding: 16px 20px 16px 60px;
  border: 2px solid #e2e8f0;
  border-radius: 16px;
  font-size: 16px;
  background: white;
  transition: all 0.3s ease;
}

.search-input:focus {
  outline: none;
  border-color: var(--primary, #3b82f6);
  box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
}

.search-stats {
  font-size: 15px;
  font-weight: 600;
  color: #374151;
}

.customers-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}

.customer-card {
  display: flex;
  gap: 20px;
  padding: 24px;
  background: rgba(255,255,255,0.8);
  border-radius: 20px;
  border: 2px solid rgba(0,0,0,0.08);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(10px);
  position: relative;
  overflow: hidden;
}

.customer-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--primary, #3b82f6);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.customer-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 25px 50px rgba(0,0,0,0.15);
  border-color: rgba(59, 130, 246, 0.3);
}

.customer-card:hover::before {
  opacity: 1;
}

.customer-card.selected {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.08) 0%, rgba(255,255,255,0.9) 100%);
  border-color: var(--primary, #3b82f6);
  box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
}

.customer-avatar {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--primary, #3b82f6), #60a5fa);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  font-size: 20px;
  flex-shrink: 0;
  box-shadow: 0 8px 24px rgba(59,130,246,0.3);
}

.customer-info {
  flex: 1;
  min-width: 0;
}

.customer-name {
  font-weight: 700;
  font-size: 18px;
  color: #1e293b;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.customer-phone {
  font-size: 15px;
  color: #64748b;
  font-weight: 500;
}

.customer-email {
  font-size: 13px;
  color: #94a3b8;
}

.customer-select {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(59, 130, 246, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--primary, #3b82f6);
  font-size: 18px;
  opacity: 0;
  transition: all 0.3s ease;
}

.customer-card:hover .customer-select,
.customer-card.selected .customer-select {
  opacity: 1;
  background: var(--primary, #3b82f6);
  color: white;
}

.customers-actions {
  display: flex;
  gap: 16px;
  justify-content: flex-end;
  padding: 24px;
  background: rgba(255,255,255,0.7);
  border-radius: 20px;
  border-top: 1px solid rgba(0,0,0,0.08);
}

.btn-primary, .btn-secondary {
  padding: 16px 32px;
  border-radius: 16px;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  border: none;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.3s ease;
  min-height: 56px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary, #3b82f6), #2563eb);
  color: white;
  box-shadow: 0 12px 32px rgba(59,130,246,0.4);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-4px);
  box-shadow: 0 20px 40px rgba(59,130,246,0.5);
}

.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.btn-secondary {
  background: transparent;
  color: #64748b;
  border: 2px solid #e2e8f0;
}

.btn-secondary:hover {
  background: #f8fafc;
  border-color: #cbd5e1;
  transform: translateY(-2px);
}

.empty-state, .error-state {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 40px;
  text-align: center;
  color: #94a3b8;
}

.error-state {
  color: #ef4444;
}

.error-state i {
  color: #f87171;
}

.page-subtitle {
  color: #64748b;
  font-size: 15px;
  font-weight: 500;
  margin-left: 8px;
}

/* Responsive */
@media (max-width: 768px) {
  .customers-grid {
    grid-template-columns: 1fr;
  }
  
  .search-header {
    flex-direction: column;
    gap: 20px;
    align-items: stretch;
  }
  
  .customers-actions {
    flex-direction: column;
  }
}
</style>

</body>
</html>
